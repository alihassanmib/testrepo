name: deploy

on:
  push:
    tags:
      - "*"

jobs:
  deploy:
    runs-on: self-hosted
    env:
      IMAGE: 10.10.83.5:8082/library/testrepo:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          docker build --build-arg VERSION=${{ github.ref_name }} -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: docker compose -p testrepo up -d
